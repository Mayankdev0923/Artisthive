services:
  postgres:
    image: postgres:16-alpine
    container_name: artisthive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artisthive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artisthive}
      POSTGRES_DB: artisthive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisthive"]
      interval: 5s
      timeout: 5s
      retries: 5

  supertokens:
    image: supertokens/supertokens-postgresql:11.4
    container_name: artisthive-supertokens
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://artisthive:${POSTGRES_PASSWORD:-artisthive}@postgres:5432/supertokens
      API_KEYS: ${SUPERTOKENS_API_KEY:-}
    ports:
      - "3567:3567"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e 'GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n' >&3 && grep -q Hello <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: artisthive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://artisthive:${POSTGRES_PASSWORD:-artisthive}@postgres:5432/artisthive?schema=public
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:-}
      SUPERTOKENS_WEBSITE_DOMAIN: ${WEB_DOMAIN:-http://localhost:5173}
      SUPERTOKENS_API_DOMAIN: ${API_DOMAIN:-http://localhost:4000}
      SUPERTOKENS_ADMIN_DOMAIN: ${ADMIN_DOMAIN:-http://localhost:5174}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      OTP_EMAIL_FROM: ${OTP_EMAIL_FROM:-Artisthive <no-reply@yourdomain.com>}
      EMAIL_API_PROVIDER: ${EMAIL_API_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MEDIA_DIR: /app/media
      PUBLIC_MEDIA_BASE_URL: ${API_DOMAIN:-http://localhost:4000}/media
    ports:
      - "4000:4000"
    volumes:
      - media:/app/media

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${API_DOMAIN:-http://localhost:4000}
    container_name: artisthive-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: ${API_DOMAIN:-http://localhost:4000}
    container_name: artisthive-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: artisthive-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  media: